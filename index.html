/* Layout: a single readable newspaper column, a sticky section bar, stories as quiet blocks separated by rules. Large type for easy reading. */
:root {

}

    --bg: #101614; --surface: #172019; --ink: #e8eee9; --muted: #9cafa6; --rule: #2a3631;

}

}
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--base); line-height: 1.6; }
.wrap { max-width: 42rem; margin: 0 auto; padding-inline: 18px; padding-block: 0 4rem; }

header.mast { padding-block: 1.75rem 1rem; display: grid; gap: .35rem; }

.mast .date { font-family: var(--f-display); font-weight: 500; color: var(--muted); font-size: .95rem; }

.glance .val { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.glance .sub { font-size: .9rem; color: var(--muted); line-height: 1.4; }
.down { color: var(--down); } .up { color: var(--up); }

nav.sections { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule); margin-inline: -18px; padding: .6rem 18px; display: flex; gap: .5rem; overflow-x: auto; scrollbar-width: none; }
nav.sections::-webkit-scrollbar { display: none; }
nav.sections a { flex: none; font-family: var(--f-display); font-weight: 600; font-size: .85rem; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: .35rem .8rem; }
nav.sections a:hover, nav.sections a:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
.textsize { margin-left: auto; display: flex; gap: .35rem; flex: none; }
.textsize button { font-family: var(--f-display); font-weight: 700; font-size: .85rem; min-width: 2.4rem; background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; border-radius: 999px; padding: .35rem .6rem; cursor: pointer; }
.textsize button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

section.sec { padding-top: 1.75rem; scroll-margin-top: 3.5rem; }
section.sec > h2 { font-family: var(--f-display); font-stretch: 85%; font-weight: 800; font-size: 1.05rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 .25rem; padding-bottom: .5rem; border-bottom: 2px solid var(--accent); }

article.story { padding-block: 1.1rem; border-bottom: 1px solid var(--rule); display: grid; gap: .45rem; }
article.story:last-child { border-bottom: 0; }
.story h3 { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; line-height: 1.25; margin: 0; text-wrap: balance; }
.top .story h3 { font-size: 1.5rem; }
.story p { margin: 0; }
.meta { font-family: var(--f-display); font-size: .8rem; font-weight: 500; color: var(--muted); display: flex; flex-wrap: wrap; gap: .25rem .75rem; }
.meta .src { font-weight: 700; color: var(--ink); }
details { margin-top: .15rem; }
summary { font-family: var(--f-display); font-weight: 600; font-size: .9rem; color: var(--accent); cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: .35rem; padding-block: .2rem; }
summary::-webkit-details-marker { display: none; }

details[open] summary::before { content: "−"; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
details ul { margin: .5rem 0 .6rem; padding-left: 1.2rem; display: grid; gap: .35rem; }
.orig { font-size: .85rem; color: var(--muted); border-left: 3px solid var(--rule); padding-left: .7rem; display: grid; gap: .15rem; }
.orig a { color: var(--accent); font-family: var(--f-display); font-weight: 600; }

footer { margin-top: 2.5rem; font-size: .85rem; color: var(--muted); line-height: 1.5; display: grid; gap: .5rem; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

<script>
(function () {
  var data = JSON.parse(document.getElementById('edition').textContent);
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

  document.getElementById('edition-date').textContent = data.dateLabel + ' · ' + data.updated;

  document.getElementById('glance').innerHTML = data.glance.map(function (g) {
    return '<div><span class="lbl">' + esc(g.label) + '</span><span class="val ' + (g.trend || '') + '">' + esc(g.value) + '</span><span class="sub">' + esc(g.sub) + '</span></div>';
  }).join('');

  var nav = document.getElementById('sections');
  var sizeCtl = nav.querySelector('.textsize');
  var main = document.getElementById('stories');
  var used = data.sections.filter(function (s) { return data.stories.some(function (st) { return st.section === s.id; }); });

  used.forEach(function (s) {
    var a = document.createElement('a');
    a.href = '#' + s.id; a.textContent = s.name;
    nav.insertBefore(a, sizeCtl);

    var items = data.stories.filter(function (st) { return st.section === s.id; });
    var sec = document.createElement('section');
    sec.className = 'sec ' + s.id; sec.id = s.id;
    sec.innerHTML = '<h2>' + esc(s.name) + '</h2>' + items.map(function (st) {
      var more = (st.details && st.details.length) ? '<ul>' + st.details.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul>' : '';
      return '<article class="story">' +
        '<h3>' + esc(st.headline) + '</h3>' +
        '<div class="meta"><span class="src">' + esc(st.source) + '</span><span>' + esc(st.time) + '</span></div>' +
        '<p>' + esc(st.summary) + '</p>' +
        '<details><summary>' + (more ? 'More detail' : 'Original report') + '</summary>' + more +
          '<div class="orig"><span>' + esc(st.zh) + '</span><a href="' + esc(st.url) + '" target="_blank" rel="noopener">Original report (Chinese) ↗</a></div>' +
        '</details>' +
      '</article>';
    }).join('');
    main.appendChild(sec);
  });

  var srcs = [];
  data.stories.forEach(function (st) { if (srcs.indexOf(st.source) < 0) srcs.push(st.source); });
  document.getElementById('sources-line').textContent = data.stories.length + ' stories today from ' + srcs.join(', ') + '.';

  var sizes = [17, 19, 21, 23, 26], idx = 1;
  try { var saved = parseInt(localStorage.getItem('hk-en-size'), 10); if (saved >= 0 && saved < sizes.length) idx = saved; } catch (e) {}
  function apply() {
    document.documentElement.style.setProperty('--base', sizes[idx] + 'px');
    try { localStorage.setItem('hk-en-size', String(idx)); } catch (e) {}
  }
  document.getElementById('bigger').addEventListener('click', function () { if (idx < sizes.length - 1) { idx++; apply(); } });
  document.getElementById('smaller').addEventListener('click', function () { if (idx > 0) { idx--; apply(); } });
  apply();
})();
</script>
